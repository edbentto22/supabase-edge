      - ./supabase/functions:/app/functions
    command: >
      deno run --allow-net --allow-env --allow-read /app/functions/hello/index.ts
    ports:
      - "54322:8000"
    environment:
      SUPABASE_URL: http://supabasekong-a8sgkowssok00os84o8g8o8s.74.235.163.40.sslip.io:8000
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}


healthcheck:
